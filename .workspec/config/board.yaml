name: WorkSpec Board Backlog
description: Work items for the WorkSpec reference implementation itself (see docs/REVIEW-2026-09.md)
spec_version: 1.0
settings:
  card_fields:
    - id
    - title
    - type
    - priority
    - assignee
  # detail_display: side-panel-vertical (default) | side-panel-horizontal | floating
  detail_display: floating
sort:
  fields:
    - created
    - updated
    - priority
  default:
    field: priority
    direction: desc
