name: WorkSpec Board Backlog
description: Work items for the WorkSpec reference implementation itself (see docs/REVIEW-2026-09.md)
spec_version: 1.0
# ID allocation (SPEC.md §18.1): every working copy allocates inside its own
# block from config/id-blocks.yaml; block 0 holds the items created before.
id_allocation:
  strategy: block
  block_size: 1000
settings:
  card_fields:
    - id
    - title
    - type
    - priority
    - assignee
  # detail_display: side-panel-vertical (default) | side-panel-horizontal | floating
  detail_display: floating
sort:
  fields:
    - created
    - updated
    - priority
  default:
    field: priority
    direction: desc
